# cargo-deny: run by scripts/check.sh before every commit.

[graph]
# protonctl builds for Apple-silicon macOS and for Linux (RFC section 11);
# other platforms' crates never build.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# RustSec advisories (the database is fetched each run); yanked crates fail too.
yanked = "deny"
# Unsound advisories anywhere in the tree, not only in direct dependencies.
unsound = "all"

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[licenses.private]
# protonctl's own licence is Apache-2.0. It is publish = false, so it is
# not checked here.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# RFC R3: protonctl's own sockets go only to 127.0.0.1, and the calendar feed is
# fetched by /usr/bin/curl. An HTTP client crate in the tree breaks that promise.
deny = [
    { crate = "reqwest", reason = "RFC R3: no HTTP client inside protonctl" },
    { crate = "hyper", reason = "RFC R3: no HTTP client inside protonctl" },
    { crate = "ureq", reason = "RFC R3: no HTTP client inside protonctl" },
    { crate = "isahc", reason = "RFC R3: no HTTP client inside protonctl" },
    { crate = "curl", reason = "RFC R3: the feed goes through /usr/bin/curl, not libcurl bindings" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
