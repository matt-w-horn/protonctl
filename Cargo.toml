[package]
name = "protonctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Local, read-only MCP server and CLI for Proton Mail, Proton Drive and Proton Calendar, through Proton's own clients. Unofficial; not affiliated with Proton AG."
license = "Apache-2.0"
publish = false

[dependencies]
aes-siv = "0.7"
# Only for its feature: AES-SIV's expanded AES keys are wiped on drop (R20).
aes = { version = "0.8", features = ["zeroize"] }
aho-corasick = "1"
anyhow = "1"
base64 = "0.23"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
mail-parser = "0.11"
phonenumber = "0.3.10"
regex = "1"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "schemars"] }
ring = "0.17"
rrule = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
tempfile = "3"
# The name model (RFC Q23, M5.2): Otter's tokenizer, without the crate's
# HTTP features (R3), and tract, a pure-Rust ONNX runtime, with its
# multithreaded matrix multiply.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tract-linalg = { version = "0.23.8", features = ["multithread-mm"] }
tract-onnx = "0.23.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
toml_edit = "0.25"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
unicode-normalization = "0.1"
zeroize = "1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# RFC Q31. The tokio runtime is ours already; crypto-rust encrypts each
# secret on the D-Bus session with a pure-Rust Diffie-Hellman exchange.
secret-service = { version = "5.2", default-features = false, features = ["rt-tokio-crypto-rust"] }
# statfs and device numbers for the memory folder's checks (R10, Q14), and
# the readers' resource limits (R21); in the tree already, through tempfile.
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }
# The document readers' sandbox (RFC R21, Q34): Landlock for files, the
# network and other processes, and a seccomp filter for sockets.
landlock = "0.4.7"
seccompiler = "0.5"
libc = "0.2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
# The installed binary is a release build; overflow panics there instead of
# wrapping silently, as it already does in debug builds and tests.
overflow-checks = true

# The name model's runtime, built optimized in `cargo test` too: a debug
# build of tract takes minutes over one window, and its debug-only check of
# each node's output shape rejects this graph's broadcast `Where` (the
# logits still match PyTorch's, `the_runtime_gives_pytorch_s_logits`).
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-data]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-onnx]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-hir]
opt-level = 3
debug-assertions = false
[profile.dev.package.tokenizers]
opt-level = 3

# Lint table (tested 2026-10-03), plus print_stdout for a stdio MCP server.
# Overrides are #[expect(lint, reason = "...")] at the site.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
redundant_imports = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
dead_code_pub_in_binary = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
use_debug = "warn"
mem_forget = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
allow_attributes_without_reason = "warn"
# stdio MCP: stdout carries only protocol frames; CLI output goes through print() and doctor().
print_stdout = "deny"
