[package]
name = "protonctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Local MCP server and CLI giving Claude scoped access to Proton Mail, Drive and Calendar through Proton's own clients"
publish = false

[dependencies]
anyhow = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
mail-parser = "0.11"
regex = "1"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "schemars"] }
ring = "0.17"
rrule = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
secrecy = "0.10.3"
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
unicode-normalization = "0.1"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
# The installed binary is a release build; overflow panics there instead of
# wrapping silently, as it already does in debug builds and tests.
overflow-checks = true

# Lint table (tested 2026-10-03), plus print_stdout for a stdio MCP server.
# Overrides are #[expect(lint, reason = "...")] at the site.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
redundant_imports = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
dead_code_pub_in_binary = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
use_debug = "warn"
mem_forget = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
allow_attributes_without_reason = "warn"
# stdio MCP: stdout carries only protocol frames; CLI output goes through print() and doctor().
print_stdout = "deny"
