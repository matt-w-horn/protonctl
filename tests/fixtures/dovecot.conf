# Dovecot for the hermetic IMAP test (RFC section 7, T11), run by
# scripts/with-dovecot.sh. It replaces the image's own dovecot.conf: IMAP
# only, implicit TLS on 993 as Bridge's SSL mode, any password for any
# user, and the mailboxes Bridge lists, with Bridge's names and roles.
protocols = imap
listen = *
ssl = required
ssl_cert = </etc/dovecot/cert.pem
ssl_key = </etc/dovecot/key.pem
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
  }
}
mail_home = /srv/mail/%Lu
mail_location = sdbox:~/Mail
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000
passdb {
  driver = static
  args = password=pass
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    auto = create
    special_use = \Sent
  }
  mailbox Drafts {
    auto = create
    special_use = \Drafts
  }
  mailbox Archive {
    auto = create
    special_use = \Archive
  }
  mailbox Starred {
    auto = create
    special_use = \Flagged
  }
  mailbox Spam {
    auto = create
    special_use = \Junk
  }
  mailbox Trash {
    auto = create
    special_use = \Trash
  }
  mailbox "All Mail" {
    auto = create
    special_use = \All
  }
}
log_path = /dev/stderr
