name: claude

# Hand an issue to Claude by giving it the `claude` label, or ask in a comment
# with @claude. Only the repository owner can do either, on an issue the owner
# wrote, and Claude sees only the owner's comments: the repository is public,
# so anyone else's text could carry instructions to an agent that can push.
# Claude works on a claude/ branch and comments a link to open the pull
# request. Every action is pinned to a commit, since this job holds a token.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      (github.event.issue.user.login || github.event.pull_request.user.login) == github.repository_owner &&
      ((github.event_name == 'issues' && github.event.label.name == 'claude') ||
       (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER'))
    runs-on: ubuntu-latest
    # Caps what one run can spend, and runs one job at a time per issue or
    # pull request, so a burst of comments cannot start many paid runs.
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # The action trades the workflow's OIDC token for the Claude app's token
      # and for a Claude API token.
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # What scripts/check.sh needs on Linux, as in ci.yml, so Claude can run it.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils pandoc dbus gnome-keyring
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Named here, since a pinned commit cannot name it as the branch did.
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-deny,cargo-llvm-cov
      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1
        with:
          # Workload identity federation: the action trades the job's GitHub OIDC
          # token for a short-lived Claude API token, so no key is stored here.
          # These IDs are not secrets.
          anthropic_federation_rule_id: fdrl_01CjqjRbGiXiNCrBswsEvT7G
          anthropic_organization_id: 61d1a2d4-6e69-4978-99f1-9d84c6617b2e
          anthropic_service_account_id: svac_01K3FVXiymWwYPVJABzivgAQ
          anthropic_workspace_id: wrkspc_01KtYq65wrh7Zfz9Z4frovb6
          include_comments_by_actor: ${{ github.repository_owner }}
          # No co-author line, no attribution and no session link in commits or pull requests.
          settings: |
            {"attribution": {"commit": "", "pr": ""}}
          # Pinned, so a change of the account's default model does not change this.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Bash(gh pr create:*)"
            --append-system-prompt "After you push, open the pull request yourself with gh pr create (title, and a body that closes the issue), and link it in your comment instead of a Create PR link.
            docs/rfc-0001.md is the design, and code cites its requirements as RFC R1 to R26.
            Run scripts/check.sh before each commit; it must pass.
            Lint overrides are expect attributes with a reason, at the site.
            Test fixtures are synthetic.
            When tests change, update the records and test counts in docs/rfc-0001/07-testing.md.
            A changed tool name, description or parameter fails tool_surface_snapshot and writes a .snap.new in src/snapshots: review it, move it over the .snap, and delete its assertion_line header.
            Commit messages: an imperative subject of at most 72 characters, a blank line, then a plain-English body saying what changed and why."
